<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mineradio — DeepSeek Harness 主题截图</title>
<meta name="description" content="Mineradio 主题在 DeepSeek Harness Web UI 上的真实界面截图：香槟金玻璃、影院辉光、流体背景。">
<style>
  :root {
    --base: #08090b;
    --ink: #f2f0ea;
    --ink-2: #cbc4b8;
    --ink-3: #98917f;
    --champagne: #f4d28a;
    --line: rgba(244, 210, 138, .12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", "Noto Sans SC", system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(760px 420px at 50% -8%, rgba(244, 210, 138, .08), transparent 70%),
      linear-gradient(180deg, rgba(0, 245, 212, .05), transparent 40%),
      var(--base);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 48px 24px 72px; }
  header { text-align: center; margin-bottom: 40px; }
  header .mark {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 700; letter-spacing: .03em;
  }
  header .mark svg { flex: none; }
  header .tag {
    display: inline-block; margin-top: 10px;
    font-size: 13px; color: var(--champagne); opacity: .9;
    letter-spacing: .04em;
  }
  header .col {
    margin-top: 8px; font-size: 13px; color: var(--ink-3);
  }
  .grid { display: flex; flex-direction: column; gap: 28px; }
  figure { margin: 0; }
  figure a { display: block; line-height: 0; }
  figure img {
    width: 100%; height: auto;
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 24px 64px rgba(0, 0, 0, .45), 0 0 34px rgba(244, 210, 138, .05);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  figure a:hover img { transform: translateY(-3px); box-shadow: 0 30px 72px rgba(0,0,0,.55), 0 0 40px rgba(244,210,138,.10); }
  figcaption {
    margin-top: 12px; font-size: 13.5px; color: var(--ink-2);
    display: flex; align-items: baseline; gap: 8px;
  }
  figcaption b { color: var(--ink); font-weight: 620; }
  figcaption .exp { color: var(--ink-3); font-size: 12px; }
  footer {
    margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line);
    text-align: center; font-size: 12.5px; color: var(--ink-3);
  }
  footer a { color: var(--champagne); text-decoration: none; }
  @media (max-width: 720px) {
    .wrap { padding: 32px 14px 56px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="9.5" stroke="#f4d28a" stroke-width="1.4"/>
        <circle cx="12" cy="12" r="4" stroke="#f4d28a" stroke-width="1.4"/>
        <circle cx="12" cy="12" r="1.4" fill="#f4d28a"/>
      </svg>
      Mineradio
    </div>
    <div class="tag">主题截图 · DeepSeek Harness Web UI</div>
    <div class="col">香槟金玻璃 · 影院辉光 · 流体背景（实机截图，点击可查看原图）</div>
  </header>

  <div class="grid">
    <figure>
      <a href="screenshot-dark.png" target="_blank" rel="noreferrer">
        <img src="screenshot-dark.png" alt="Mineradio 深色模式主界面" loading="lazy">
      </a>
      <figcaption><b>深色演播室</b><span class="exp">青绿玻璃压在香槟金流体上，发送栏浮在液体里</span></figcaption>
    </figure>

    <figure>
      <a href="screenshot-light.png" target="_blank" rel="noreferrer">
        <img src="screenshot-light.png" alt="Mineradio 浅色模式主界面" loading="lazy">
      </a>
      <figcaption><b>浅色暖纸</b><span class="exp">奶油底、青铜描边、同一套家族玻璃</span></figcaption>
    </figure>

    <figure>
      <a href="screenshot-settings-dark.png" target="_blank" rel="noreferrer">
        <img src="screenshot-settings-dark.png" alt="Mineradio 深色模式设置面板" loading="lazy">
      </a>
      <figcaption><b>外观分组</b><span class="exp">演播室 / 深海 / 午夜 / 雾面 / 彩虹，外加性能档</span></figcaption>
    </figure>
  </div>

  <footer>
    Mineradio theme · <a href="https://github.com/dhicoc/dsh-theme-mineradio" target="_blank" rel="noreferrer">github.com/dhicoc/dsh-theme-mineradio</a>
  </footer>
</div>
</body>
</html>
